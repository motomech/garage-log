name: Android APK

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk garage-log.apk

      - uses: actions/upload-artifact@v4
        with:
          name: garage-log-apk
          path: garage-log.apk

      # Every push to main publishes a release. The newest one is always at
      # https://github.com/motomech/garage-log/releases/latest/download/garage-log.apk
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Garage Log 0.1.${{ github.run_number }}
          body: Download garage-log.apk on your phone and tap it to install or update. Once installed, the app offers new versions itself.
          # Lists the merged pull requests; the app shows them as "What's new".
          generate_release_notes: true
          files: garage-log.apk
          make_latest: true
